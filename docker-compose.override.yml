services:
  identity.center.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_HTTP_PORTS=${ASPNETCORE_HTTP_PORTS}
      - ASPNETCORE_URLS=${ASPNETCORE_URLS}
      - ConnectionStrings:IRedis=identity.center.redis:6379,password=${REDIS_PASSWORD},abortConnect=false,connectTimeout=5000,syncTimeout=5000

      - BrokerOptions:Host=identity.center.broker
      - BrokerOptions:Username=${RABBITMQ_DEFAULT_USER}
      - BrokerOptions:Password=${RABBITMQ_DEFAULT_PASS}
      - BrokerOptions:VirtualHost=/
      - BrokerOptions:Exchange=comms.exchange
      - ConnectionStrings:IdentityContext=${ASPNETCORE_APPCONNECTIONSTRING}
      - IdentityConfigurationProvider:Id=${IDENTITY_MAINAPP_ID}

      # comentar los ambientes para los que no se quiera generar documentacion ni stack traces (requerido para seguridad)
      - EnvironmentOptions:DevEnvironments:0=Development
      - EnvironmentOptions:DevEnvironments:1=Quality
      # - EnvironmentOptions:DevEnvironments:2=Production

      - Servers:0:Url=${Servers0Url}
      - Servers:0:Description=${Servers0Description}
      - Servers:1:Url=${Servers1Url}
      - Servers:1:Description=${Servers1Description}
      - Servers:2:Url=${Servers2Url}
      - Servers:2:Description=${Servers2Description}

      - CorsAuthorizationFilter:0=*
    ports:
      - "56676:8080"
    depends_on:
      identity.center.redis:
        condition: service_healthy
      identity.center.broker:
        condition: service_healthy
  identity.center.redis:
    expose:
      - 6379
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD}"
      --maxmemory 3gb
      --maxmemory-policy allkeys-lru
      --maxclients 10000
      --tcp-backlog 65536
      --tcp-keepalive 300
      --appendonly yes
      --appendfsync everysec
      --no-appendfsync-on-rewrite yes
      --lazyfree-lazy-eviction yes
      --lazyfree-lazy-expire yes
      --active-defrag-threshold-lower 10
      --active-defrag-threshold-upper 100
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
  identity.center.broker:
    expose:
      - 5672
      - 15672
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s